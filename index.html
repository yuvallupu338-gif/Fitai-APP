    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) { return initialValue; }
      });
      const setValue = useCallback(value => {
        try {
          setStoredValue(prev => {
            const valueToStore = value instanceof Function ? value(prev) : value;
            window.localStorage.setItem(key, JSON.stringify(valueToStore));
            return valueToStore;
          });
        } catch (error) { console.error("Storage error:", error); }
      }, [key]);
      return [storedValue, setValue];
    }

    ];

    const TARGETS = ['push','core','legs','pull','push','core','legs','pull','core'];

    const getDetailedDesc = (name) => {
       if (name.includes('שכיבות סמיכה')) return "1. מקם ידיים ברוחב כתפיים.\n2. שמור על גוף ישר כמו קרש, כווץ ישבן ובטן.\n3. רד עד שהחזה כמעט נוגע ברצפה.\n4. דחוף בעוצמה למעלה עד נעילת מרפקים.";
       if (name.includes('מתח')) return "1. תלה מהמוט במצב 'דד האנג' (Dead Hang).\n2. משוך את השכמות למטה ואחורה.\n3. משוך עד שהסנטר עוקף את המוט.\n4. רד בשליטה מלאה חזרה למטה.";
       if (name.includes('סקוואט')) return "1. עמוד ברוחב כתפיים, כפות רגליים החוצה.\n2. דחוף אגן לאחור (כמו ישיבה על כיסא).\n3. רד לפחות עד שבירת מקביל.\n4. דחוף דרך העקבים חזרה לעמידה.";
       if (name.includes('מקבילים') || name.includes('Dips')) return "1. אחוז במקבילים ודחוף כתפיים מהאוזניים.\n2. רד בשליטה עד שהכתף מתחת למרפק.\n3. דחוף חזרה למעלה באגרסיביות.";
       if (name.includes('פלאנק')) return "1. הישען על האמות מתחת לכתפיים.\n2. כווץ בטן חזק ואל תיתן לגב לצנוח.\n3. נשום רגיל תוך כדי כיווץ רציף.";
       if (name.includes('דדליפט')) return "1. מוט חוצה את מרכז כף הרגל.\n2. אגן אחורה, גב ישר לגמרי.\n3. דחוף את הרצפה עם הרגליים והזדקף.";
       return "1. שמור על מנח יציב.\n2. רד בשליטה (אקסצנטרי) ל-2 שניות.\n3. עלה בעוצמה.\n4. הוצא אוויר במאמץ.";
    };

    const generatePersonalizedTiers = (baseMatrix, typeName, answers) => {
      const age = parseInt(answers.age) || 25;
      const weight = parseInt(answers.weight) || 70;
      const height = parseInt(answers.height) || 170;
      const bmi = weight / Math.pow(height/100, 2);
      
      let maxTiers = 10; 
      if (age > 60 || parseFloat(bmi) > 32) maxTiers = Math.min(4, maxTiers);
      else if (age > 50 || parseFloat(bmi) > 28) maxTiers = Math.min(6, maxTiers);
      
      const tiers = [];
      for (let i = 0; i < maxTiers; i++) {
        const skills = [];
        for (let j = 0; j < 9; j++) {
          let exName = baseMatrix[i][j];
          if (parseFloat(bmi) > 26 || age > 45) {
             exName = exName.replace('קפיצה', 'מבוקרת (ללא קפיצה)').replace('מתפרץ', 'איטי').replace("פלאנץ'", "החזקה סטטית");
          }
          let wFactor = 0;
          if (typeName === 'gym') {
             wFactor = 0.2 + (i * 0.15); 
             if(TARGETS[j] === 'legs' || exName.includes('דדליפט')) wFactor += 0.3; 
          }
          skills.push({ id: `${typeName}_${i}_${j}`, name: exName, desc: getDetailedDesc(exName), target: TARGETS[j], wFactor: wFactor, level: i+1 });
        }
        tiers.push({ level: i + 1, name: `טיר ${i + 1}`, skills, testDesc: "" });
      }
      return tiers;
    };

    const calcTDEE = (w, h, a, gender, goal) => {
      let W = parseFloat(w) || 70; let H = parseFloat(h) || 175; let A = parseFloat(a) || 25;
      if(H < 3) H = H * 100; if(W > 250) W = 70; 
      const bmr = gender === 'נקבה' ? (10 * W) + (6.25 * H) - (5 * A) - 161 : (10 * W) + (6.25 * H) - (5 * A) + 5;
      const baseTdee = Math.round(bmr * 1.375);
      if (A < 16) return Math.min(2400, Math.max(1500, baseTdee));
      let target = goal?.indexOf('ירידה') >= 0 ? baseTdee - 300 : baseTdee + 300;
      return Math.min(3500, Math.max(1200, target));
    };

    const getDynamicMeals = (tdee, mood) => {
       const p = {
         training: {
           morning: [
             {name: 'בוקר חביתת כוח', tags:['lactose'], multi: 0.25, ings: (t) => `${Math.max(1, Math.round(t/1000))} פרוסות לחם מלא, חביתה מ-${Math.max(2, Math.round(t/700))} ביצים, ${Math.round(t/30)} גרם גבינה לבנה 5% וירקות.`, recipe: "1. טרוף את הביצים במחבת שחוממה עם כפית שמן.\n2. מרח את הגבינה בשכבה דקה על הלחם.\n3. קצוץ ירקות טריים והגש הכל יחד להתחלת יום חזקה."},
             {name: 'קערת שיבולת שועל', tags:['lactose','nuts'], multi: 0.28, ings: (t) => `${Math.round(t*0.1)} גרם יוגורט טבעי, ${Math.round(t*0.025)} כפות שיבולת שועל, וכפית חמאת בוטנים.`, recipe: "1. ערבב את שיבולת השועל עם מעט מים חמים או יוגורט.\n2. תן לזה לשבת 5 דקות לספיגה.\n3. זלף את חמאת הבוטנים מעל."}
           ],
           lunch: [
             {name: 'ארוחת ברזל: עוף ואורז', tags:[], multi: 0.40, ings: (t) => `${Math.round(t*0.08)} גרם חזה עוף/טופו מבושל, ${Math.round(t*0.07)} גרם אורז מלא, סלט גדול.`, recipe: "1. צלה את חזה העוף או הטופו במחבת פסים חמה.\n2. חמם את האורז המלא.\n3. קצוץ סלט גדול ותבל."}
           ],
           evening: [
             {name: 'סיום התאוששות', tags:['fish','egg'], multi: 0.35, ings: (t) => `${Math.round(t*0.06)} גרם טונה במים או ${Math.max(2, Math.round(t/1000))} ביצים קשות, סלט עשיר.`, recipe: "1. סנן היטב את הטונה או קלף את הביצים.\n2. הכן סלט גדול ורענן.\n3. שים הכל בקערה, זלף טחינה גולמית מלמעלה."}
           ]
         },
         rest: {
           morning: [{name: 'דייסה מנחמת', tags:['lactose'], multi: 0.25, ings: (t) => `${Math.round(t*0.03)} כפות שיבולת שועל, חלב.`, recipe: "1. חמם חלב ושיבולת שועל."}],
           lunch: [{name: 'מג׳דרה לבנייה', tags:[], multi: 0.40, ings: (t) => `${Math.round(t*0.12)} גרם מג'דרה, סלט.`, recipe: "1. חמם את המג'דרה."}],
           evening: [{name: 'סלט יווני', tags:['lactose'], multi: 0.35, ings: (t) => `סלט ענק, ${Math.round(t*0.04)} גרם בולגרית.`, recipe: "1. חתוך ירקות והוסף גבינה."}]
         }
       };
       return p[mood] || p.training; 
    }

    const ALLERGY_MAP = {'בוטנים':'peanut','אגוזים':'nuts','גלוטן':'gluten','לקטוז':'lactose','ביצים':'egg','דגים':'fish','סויה':'soy'};

    const NOTIF_SLOTS = [
      {id:'morning',hour:7,min:0,icon:'☀️',title:'בוקר טוב!',bodyFn:(isW,g,n)=>`${n}, היום ${isW?'יום אימון 💪':'יום מנוחה 🔋'}`},
      {id:'preworkout',hour:17,min:30,icon:'💪',title:'הכנה לאימון',bodyFn:(isW)=>isW?'חימום ומים - האימון עוד שעה!':'יום מנוחה - מתיחות קלות'},
      {id:'workout',hour:18,min:0,icon:'🔥',title:'זמן אימון!',bodyFn:(isW,g,n)=>isW?`${n}, Fitai מחכה לך!`:'יום מנוחה - הגוף מתחזק'},
      {id:'sleep',hour:22,min:0,icon:'😴',title:'זמן שינה',bodyFn:(isW,g,n)=>`${n}, שינה = בנייה. לך לישון!`},
    ];

    // ─────────────────────────────────────────
    // COMPONENTS
    // ─────────────────────────────────────────
    function GeneratingScreen({ onFinish, th }) {
      const [progress, setProgress] = useState(0);
      const [text, setText] = useState("מנתח נתונים אישיים...");

      useEffect(() => {
        let currentProgress = 0;
        const interval = setInterval(() => {
          currentProgress += 1; setProgress(currentProgress);
          if (currentProgress === 15) setText("מחשב נתוני TDEE ומגן מפרקים...");
          if (currentProgress === 35) setText("מפעיל פילטר מחיקות (Smart Delete) אגרסיבי...");
          if (currentProgress === 55) setText("מסנכרן אימונים סביב התרגילים הקשים שלך...");
          if (currentProgress === 75) setText("מכין מילון ביומכני מתקדם...");
          if (currentProgress === 90) setText("שומר נתונים ומתחיל...");
          if (currentProgress >= 100) { 
             clearInterval(interval); 
             onFinish(); 
          }
        }, 30); 
        return () => clearInterval(interval);
      }, [onFinish]); 

      return (
        <div dir="rtl" className="min-h-screen bg-black flex flex-col items-center justify-center p-8 text-center">
          <div className={`w-32 h-32 mb-8 rounded-full border-4 ${th.borderPrimary} border-t-transparent animate-spin flex items-center justify-center`}><div className="text-4xl animate-none">{th.emoji}</div></div>
          <h2 className="text-3xl font-black text-white mb-2">מייצר את הטירוף...</h2>
          <p className={`text-sm ${th.textPrimaryLight} font-bold mb-12 h-6 transition-all`}>{text}</p>
          <div className="w-full bg-zinc-900 p-1 rounded-full border border-zinc-800 shadow-inner mb-4">
             <div className={`h-3 rounded-full ${th.gradientBg} transition-all duration-100 ease-linear shadow-lg ${th.shadowPrimary}`} style={{width: `${progress}%`}}></div>
          </div>
          <div className="text-zinc-500 font-bold tabular-nums text-xl">{progress}%</div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useLocalStorage('fitai_screen', 'splash');
      const [answers, setAnswers] = useLocalStorage('fitai_answers', {});
      const [qIdx, setQIdx] = useLocalStorage('fitai_qIdx', 0);
      const [xp, setXp] = useLocalStorage('fitai_xp', 0);
      const [workouts, setWorkouts] = useLocalStorage('fitai_workouts', 0);
      const [mastered, setMastered] = useLocalStorage('fitai_mastered', []);
      const [unlockedTier, setUnlockedTier] = useLocalStorage('fitai_tier', 1);
      const [notifEnabled, setNotifEnabled] = useLocalStorage('fitai_notifs', {});
      
      const [thisWeekWorkouts, setThisWeekWorkouts] = useLocalStorage('fitai_thisWeekWorkouts', 0);
      const [thisWeekMeals, setThisWeekMeals] = useLocalStorage('fitai_thisWeekMeals', 0);
      const [lastReportReset, setLastReportReset] = useLocalStorage('fitai_lastReportReset', null);
      const [lastMealTrack, setLastMealTrack] = useLocalStorage('fitai_lastMealTrack', null);

      const [localVal,setLocalVal] = useState('');
      const [toast,setToast] = useState(null);
      const [agreed,setAgreed] = useState(false);
      const [toastQueue,setToastQueue] = useState([]);
    
      const isHybrid = answers.style === 'שילוב (גם וגם)';
      const th = getTheme(answers.style);
      
      const caliTiersBase = useMemo(() => generatePersonalizedTiers(CALI_MATRIX, 'cali', answers), [answers]);
      const gymTiersBase = useMemo(() => generatePersonalizedTiers(GYM_MATRIX, 'gym', answers), [answers]);

      // ─────────────────────────────────────────
      // SMART DELETE LOGIC: SUPER AGGRESSIVE THRESHOLDS
      // ─────────────────────────────────────────
      const autoMasteredIds = useMemo(() => {
         const p = answers.pushups || '0-5'; const pull = answers.pullups || '0';
         const sit = answers.situps || '0-15'; const plnk = answers.plank || 'פחות מדקה';
         const sq = answers.squats || '0-20';
         const ids = [];
         
         const addIdsByCol = (cols, maxTier) => {
             for(let t=0; t<maxTier; t++) {
                 cols.forEach(c => { ids.push(`cali_${t}_${c}`); ids.push(`gym_${t}_${c}`); });
             }
         };

         if (p === '30+') addIdsByCol([0, 4], 6); else if (p === '16-30') addIdsByCol([0, 4], 4); else if (p === '6-15') addIdsByCol([0, 4], 2); 
         if (pull === '10+') addIdsByCol([3, 7], 6); else if (pull === '5-10') addIdsByCol([3, 7], 4); else if (pull === '1-4') addIdsByCol([3, 7], 2);
         if (sit === '50+') addIdsByCol([5], 6); else if (sit === '31-50') addIdsByCol([5], 4); else if (sit === '16-30') addIdsByCol([5], 2);
         if (plnk === '3 דקות ומעלה') addIdsByCol([1, 8], 6); else if (plnk === '2-3 דקות') addIdsByCol([1, 8], 4); else if (plnk === '1-2 דקות') addIdsByCol([1, 8], 2);
         if (sq === 'מצליח פיסטול (רגל אחת)') addIdsByCol([2, 6], 8); else if (sq === '51-100') addIdsByCol([2, 6], 6); else if (sq === '21-50') addIdsByCol([2, 6], 4); 

         return ids;
      }, [answers.pushups, answers.pullups, answers.situps, answers.plank, answers.squats]);

      const buildFilteredTiers = useCallback((baseTiers, typeName) => {
          let filtered = baseTiers.map(tier => {
              const remainingSkills = tier.skills.filter(sk => !autoMasteredIds.includes(sk.id));
              if (remainingSkills.length === 0) return null; 

              let repsPush = Math.max(4, 15 - tier.level * 2);
              let repsPull = Math.max(2, 10 - tier.level);
              
              const pushSk = remainingSkills.find(s=>s.target==='push') || remainingSkills[0];
              const pullSk = remainingSkills.find(s=>s.target==='pull' || s.target==='legs') || remainingSkills.find(s=>s.target!=='push') || remainingSkills[0];
              const coreSk = remainingSkills.find(s=>s.target==='core') || remainingSkills[0];

              let testDesc = "";
              if (tier.level === baseTiers.length) {
                  testDesc = `🏆 מבחן מאסטר סופי! הוכח שאתה אגדה: שבור שיא ב-${pushSk.name} וב-${pullSk.name}!`;
              } else if (typeName === 'gym') {
                  testDesc = `⚡ מבחן מעבר (לרמה הבאה): בצע 3 סטים של ${repsPush} חזרות ב-${pushSk.name}, ואז ${repsPull} חזרות ב-${pullSk.name}.`;
              } else {
                  testDesc = `🔥 מבחן סיבולת (לרמה הבאה): בצע ${repsPush} חזרות של ${pushSk.name}, עבור ל-${repsPull} חזרות ב-${pullSk.name}, וסיים בסט מקסימום של ${coreSk.name}.`;
              }

              return { ...tier, testDesc, skills: remainingSkills };
          }).filter(Boolean); 

          if (filtered.length === 0 && baseTiers.length > 0) {
              const lastTier = baseTiers[baseTiers.length - 1];
              filtered = [{...lastTier, testDesc: "👑 אתה בשיא! כל המיומנויות הבסיסיות הושלמו. התמקד כעת בכוח טהור.", name: "מאסטר עליון", skills: lastTier.skills}];
          }

          return filtered;
      }, [autoMasteredIds]);

      const caliTiers = useMemo(() => buildFilteredTiers(caliTiersBase, 'cali'), [caliTiersBase, buildFilteredTiers]);
      const gymTiers = useMemo(() => buildFilteredTiers(gymTiersBase, 'gym'), [gymTiersBase, buildFilteredTiers]);
      
      const allCurrentTiers = useMemo(() => isHybrid ? [...caliTiers, ...gymTiers] : (th.emoji === '⚡' ? gymTiers : caliTiers), [isHybrid, th.emoji, caliTiers, gymTiers]);

      // THE DEADLOCK FIX: Auto-adjusts unlocked tier so you can never be locked out of your first active level
      const effectiveUnlockedTier = useMemo(() => {
         if (!allCurrentTiers || allCurrentTiers.length === 0) return unlockedTier;
         const lowestAvailableLevel = Math.min(...allCurrentTiers.map(t => t.level));
         const maxPossibleTier = Math.max(...allCurrentTiers.map(t => t.level));
         return Math.min(maxPossibleTier, Math.max(unlockedTier, lowestAvailableLevel));
      }, [unlockedTier, allCurrentTiers]);

      const effectiveMastered = useMemo(() => Array.from(new Set([...mastered, ...autoMasteredIds])), [mastered, autoMasteredIds]);

      const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null),2500); };
      const addXP = (n) => { setXp(p=>(parseInt(p)||0)+n); showToast(`+${n} XP ${th.emoji}`); };
    
      useEffect(() => {
        if (screen !== 'app') return;
        const tick = () => {
          const now = new Date();
          const isW  = answers.days && answers.days.indexOf(DAYS_HE[now.getDay()])>=0;
          const goal = answers.goal && answers.goal.indexOf('ירידה')>=0 ? 'חיטוב' : 'מסה';
          const name = answers.name||'Lupu';
          
          NOTIF_SLOTS.forEach(slot => {
            if (notifEnabled[slot.id] === false) return;
            if (now.getHours()===slot.hour && now.getMinutes()===slot.min && now.getSeconds()<35) {
              const body = slot.bodyFn(isW,goal,name);
              if ('Notification' in window && Notification.permission === 'granted') { new Notification(slot.title, { body, icon: th.emoji }); }
              setToastQueue(q => { if (q.find(x => x.id === slot.id)) return q; return [...q,{id: slot.id, icon:slot.icon, title:slot.title, body, key:Date.now()+slot.id}]; });
            }
          });
        };
        const id = setInterval(tick, 30000);
        return () => clearInterval(id);
      }, [screen, notifEnabled, answers, th.emoji]);

      useEffect(() => {
        if (!toastQueue.length) return;
        const t = setTimeout(() => setToastQueue(q => q.slice(1)), 5000);
        return () => clearTimeout(t);
      }, [toastQueue]);

      const filteredQ = useMemo(() => {
         return QUESTIONS.filter(q => {
            const isGymOrHybrid = answers.style && (answers.style.includes('חדר כושר') || answers.style.includes('שילוב'));
            if (q.id === 'location' && isGymOrHybrid) return false; 
            if (q.id === 'equip' && isGymOrHybrid) return false; 
            if (q.id === 'equip' && answers.location && answers.location.includes('חדר כושר')) return false;
            return true;
         });
      }, [answers.location, answers.style]);

      // INDEX BOUNDS PROTECTION: Smooth transitions if questions are skipped
      useEffect(() => {
         if (qIdx >= filteredQ.length && filteredQ.length > 0) {
             setQIdx(Math.max(0, filteredQ.length - 1));
         }
      }, [filteredQ.length, qIdx, setQIdx]);

      const activeQ = filteredQ[Math.min(qIdx, Math.max(0, filteredQ.length - 1))] || {};
    
      useEffect(() => { 
        if (!activeQ?.id) return;
        let initial = answers[activeQ.id];
        if (initial === undefined) {
           if (activeQ.type === 'slider') initial = activeQ.default;
           else if (activeQ.type === 'multi' || activeQ.type === 'days') initial = [];
           else initial = '';
        }
        setLocalVal(initial); 
      }, [qIdx, activeQ, answers]); 
    
      const canProceed = () => {
        if (!activeQ || !activeQ.id) return false;
        if (activeQ.id === 'dislikes') return true; 
        const val = localVal;
        if (val === undefined || val === null || val === '') return false;
        if (activeQ.type === 'slider' || activeQ.type === 'number' || activeQ.type === 'text') return String(val).trim() !== '';
        if (activeQ.type === 'multi' || activeQ.type === 'days') return Array.isArray(val) && val.length > 0;
        if (activeQ.type === 'choice') return String(val).trim() !== '';
        return false;
      };
      
      const goNext = () => {
        if(!canProceed()) return; 
        let na = {...answers};
        if (['text','number','slider','multi','days','choice'].includes(activeQ.type)) na[activeQ.id] = localVal;
        setAnswers(na);
        if (qIdx < filteredQ.length - 1) setQIdx(qIdx + 1); else setScreen('generating');
      };
      
      const setChoice = (opt) => {
        let na = {...answers, [activeQ.id]:opt};
        const isGymOrHybrid = (activeQ.id === 'style' && (opt.includes('חדר כושר') || opt.includes('שילוב')));
        if (isGymOrHybrid) {
          na.location = 'חדר כושר';
          na.equip = ['מוט מתח','מקבילים','טבעות','משקולות','גומיות','מכשירים'];
        }
        if (activeQ.id==='location' && opt.includes('חדר כושר')) {
          na.equip = ['מוט מתח','מקבילים','טבעות','משקולות','גומיות','מכשירים'];
        }
        setAnswers(na);
        setLocalVal(opt);
        
        if (qIdx < filteredQ.length - 1) setQIdx(qIdx + 1);
        else setScreen('generating');
      };
      
      const toggleMulti = (opt) => {
        const cur = Array.isArray(localVal) ? localVal : []; 
        const excl = ['ללא','ללא פציעות','ללא ציוד'];
        if (excl.includes(opt)) {
            setLocalVal([opt]);
            return;
        }
        const filtered = cur.filter(x => !excl.includes(x));
        const next = filtered.includes(opt) ? filtered.filter(x => x !== opt) : [...filtered, opt];
        setLocalVal(next);
      };
    
      const resetApp = () => {
        if(window.confirm("האם אתה בטוח שברצונך למחוק את כל הנתונים ולהתחיל מחדש? פעולה זו תאפס הכל.")){
          localStorage.clear(); window.location.reload(); 
        }
      };

      const toggleNotif = async (id, val) => {
        if (val && 'Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') { await Notification.requestPermission(); }
        setNotifEnabled(prev => ({...prev, [id]:val}));
      };

      const toggleAllNotifs = async () => {
        const allOn = NOTIF_SLOTS.every(s => notifEnabled[s.id] !== false);
        if (!allOn && 'Notification' in window && Notification.permission !== 'granted') { await Notification.requestPermission(); }
        const next = {}; NOTIF_SLOTS.forEach(s => { next[s.id] = !allOn; }); setNotifEnabled(next);
      };

      const sendTestNotif = (slot) => {
        const isW  = answers.days && answers.days.indexOf(DAYS_HE[new Date().getDay()])>=0;
        const goal = answers.goal && answers.goal.indexOf('ירידה')>=0 ? 'חיטוב' : 'מסה';
        const body = slot.bodyFn(isW, goal, answers.name||'Lupu');
        if ('Notification' in window && Notification.permission === 'granted') { new Notification(slot.title, { body, icon: th.emoji }); }
        setToastQueue(q => [...q, {icon:slot.icon, title:slot.title, body, key:Date.now()}]);
      };

      const handleMealTrack = () => {
        const todayStr = new Date().toDateString();
        if (lastMealTrack !== todayStr) {
          setThisWeekMeals(m => m + 1); setLastMealTrack(todayStr); showToast(`✅ תזונה יומית נרשמה בהצלחה! +20 XP`); addXP(20);
        } else showToast('כבר סימנת תזונה להיום 🏆');
      };
      
      if (screen==='splash') return (
        <div dir="rtl" className="min-h-screen bg-black flex flex-col items-center justify-center p-6 relative overflow-hidden" style={{fontFamily:'system-ui,sans-serif'}}>
          <div className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-600 rounded-full opacity-10 blur-[100px]`}/>
          <div className="relative z-10 text-center w-full max-w-sm">
            <div className={`w-28 h-28 mx-auto mb-6 rounded-3xl bg-zinc-900 border border-zinc-800 flex items-center justify-center shadow-2xl shadow-orange-500/20 text-6xl`}>🔥</div>
            <h1 className={`text-6xl font-black text-white mb-3 tracking-tight`}>Fitai</h1>
            <p className="text-zinc-400 text-lg mb-12">המערכת החכמה שמותאמת במאה אחוז אליך.</p>
            <button onClick={()=>setScreen('health')} className={`w-full bg-gradient-to-r from-orange-500 to-red-600 text-white font-black py-5 rounded-2xl text-xl hover:scale-105 active:scale-95 transition-all shadow-lg shadow-orange-500/30 flex items-center justify-center gap-3`}>
              <span>התחל / המשך</span>
            </button>
          </div>
        </div>
      );
    
      if (screen==='health') return (
        <div dir="rtl" className="min-h-screen bg-black flex flex-col p-6" style={{fontFamily:'system-ui,sans-serif'}}>
          <div className="max-w-md mx-auto w-full flex-1 flex flex-col pt-4">
            <div className={`text-orange-500 font-bold uppercase tracking-widest text-xs mb-2`}>מסמך משפטי מחייב</div>
            <h2 className="text-3xl font-black text-white mb-5">בטיחות לפני הכל.</h2>
            <div className="flex-1 bg-zinc-900 rounded-3xl p-6 border border-zinc-800 mb-5 overflow-y-auto max-h-96 space-y-4 text-zinc-300 text-sm leading-relaxed">
              <p><b className="text-white block mb-1">1. פטור נזיקין:</b>האימונים באחריותך הבלעדית.</p>
              <p><b className="text-white block mb-1">2. אישור רפואי:</b>חובה להתייעץ עם רופא לפני תחילת תוכנית אימונים.</p>
              <p><b className="text-white block mb-1">3. כאב = עצור:</b>כאב חד, סחרחורת, בחילה? עצור מיידית.</p>
              <p><b className="text-white block mb-1">4. תזונה:</b>התפריטים הם המלצה כללית בלבד.</p>
            </div>
            <button type="button" onClick={()=>setAgreed(!agreed)} className={`flex justify-between items-center p-5 rounded-2xl border-2 mb-4 transition-all w-full text-right ${agreed?`border-orange-500 bg-orange-500/10`:'border-zinc-700 hover:border-zinc-600 cursor-pointer'}`}>
              <div className={`w-6 h-6 rounded flex items-center justify-center border-2 flex-shrink-0 transition-all ${agreed?`bg-orange-500 border-orange-500`:'border-zinc-500'}`}>{agreed && <Check className="w-4 h-4 text-white" strokeWidth={3}/>}</div>
              <span className="font-bold text-sm text-white">קראתי ואני מאשר/ת הכל</span>
            </button>

    function WorkoutPlayer({ answers, mastered, duration, wType, caliTiersBase, gymTiersBase, unlockedTier, onFinish, onExit, th }) {
      // ─────────────────────────────────────────
      // TRUE DYNAMIC WORKOUT GENERATOR (BUG FIX #1)
      // ─────────────────────────────────────────
      const plan = useMemo(() => {
        const getSkillFromBase = (baseMatrix, cols) => {
            if (!baseMatrix || !baseMatrix.length) return { name: 'גיבוי', wFactor: 0, level: 1 }; 
            
            for (let tierIdx = 0; tierIdx < baseMatrix.length; tierIdx++) {
                const tier = baseMatrix[tierIdx];
                if (!tier || !tier.skills) continue;
                for (let col of cols) {
                    const sk = tier.skills[col];
                    if (sk && !(mastered||[]).includes(sk.id)) return sk; 
                }
            }
            // Fallback to the absolute hardest skill available in that column
            const lastTier = baseMatrix[baseMatrix.length - 1];
            for (let col of cols) {
                if (lastTier && lastTier.skills[col]) return lastTier.skills[col];
            }
            return { name: 'תרגיל מתקדם', wFactor: 0, level: 1 }; 
        };

        let pPush, pPull, pCore, pLegs;
        if (wType === 'cali') {
            pPush = getSkillFromBase(caliTiersBase, [0, 4]); // Pushups, Handstand
            pPull = getSkillFromBase(caliTiersBase, [3, 7]); // Pullups, Rows
            pCore = getSkillFromBase(caliTiersBase, [1, 5, 8]); // Core
            pLegs = getSkillFromBase(caliTiersBase, [2, 6]); // Legs
        } else if (wType === 'gym') {
            pPush = getSkillFromBase(gymTiersBase, [0, 4]);
            pPull = getSkillFromBase(gymTiersBase, [3, 7]);
            pCore = getSkillFromBase(gymTiersBase, [1, 5, 8]);
            pLegs = getSkillFromBase(gymTiersBase, [2, 6]);
        } else { // hybrid
            pPush = getSkillFromBase(caliTiersBase, [0, 4]); // Cali Upper
            pPull = getSkillFromBase(caliTiersBase, [3, 7]); // Cali Upper
            pLegs = getSkillFromBase(gymTiersBase, [2, 6]);  // Gym Legs
            pCore = getSkillFromBase(gymTiersBase, [1, 5, 8]); // Gym Core
        }

        let generatedPlan = [
          { target: 'legs', name: pLegs?.name || 'סקוואט', wFactor: pLegs?.wFactor||0, reps: '12' },
          { target: 'push', name: pPush?.name || 'שכיבות סמיכה', wFactor: pPush?.wFactor||0, reps: '10' },
          { target: 'core', name: pCore?.name || 'פלאנק', wFactor: pCore?.wFactor||0, reps: "45 שנ'" },
          { target: 'pull', name: pPull?.name || 'מתח', wFactor: pPull?.wFactor||0, reps: '8' }
        ];

        let exCount=4, sets=3;
        if (duration===45){exCount=5;sets=3;}
        if (duration===60){exCount=5;sets=4;}
        if (duration===90){exCount=6;sets=4;}
        
        if (exCount > 4) {
            let pLegs2, pPush2;
            if (wType === 'hybrid' || wType === 'cali') {
                pLegs2 = getSkillFromBase(wType==='hybrid'?gymTiersBase:caliTiersBase, [6, 2]); // Alt leg
                pPush2 = getSkillFromBase(caliTiersBase, [4, 0]); // Alt push
            } else {
                pLegs2 = getSkillFromBase(gymTiersBase, [6, 2]);
                pPush2 = getSkillFromBase(gymTiersBase, [4, 0]);
            }
            generatedPlan.push({ target: 'legs', name: pLegs2.name, wFactor: pLegs2.wFactor, reps: '10/רגל' });
            if (exCount > 5) generatedPlan.push({ target: 'push', name: pPush2.name, wFactor: pPush2.wFactor, reps: '10' });
        }
        generatedPlan = generatedPlan.slice(0,exCount);

        let pushMulti = 1.0, pullMulti = 1.0, coreMulti = 1.0, legsMulti = 1.0;
        if(answers.pushups === '30+') pushMulti = 1.8; else if(answers.pushups === '16-30') pushMulti = 1.4; else if(answers.pushups === '0-5') pushMulti = 0.6;
        if(answers.pullups === '10+') pullMulti = 1.8; else if(answers.pullups === '5-10') pullMulti = 1.4; else if(answers.pullups === '0') pullMulti = 0.6;
        const sit = answers.situps || '0-15'; const plnk = answers.plank || 'פחות מדקה';
        if(sit === '50+' || plnk === '3 דקות ומעלה') coreMulti = 1.8; else if(sit === '31-50' || plnk === '2-3 דקות') coreMulti = 1.4; else if(sit === '0-15' && plnk === 'פחות מדקה') coreMulti = 0.6;
        const sq = answers.squats || '0-20';
        if(sq === 'מצליח פיסטול (רגל אחת)' || sq === '51-100') legsMulti = 1.8; else if(sq === '21-50') legsMulti = 1.4; else if(sq === '0-20') legsMulti = 0.6;
        
        const userWeight = parseInt(answers.weight) || 70;

        return generatedPlan.map(e => {
          let multi = 1.0;
          if (e.target === 'push') multi = pushMulti;
          else if (e.target === 'pull') multi = pullMulti;
          else if (e.target === 'core') multi = coreMulti;
          else if (e.target === 'legs') multi = legsMulti;

          let r = e.reps || '10';
          let finalReps = "";
          if(r.includes("שנ'")) finalReps = `${Math.round(parseInt(r) * multi)} שנ'`;
          else if(r.includes("/רגל")) finalReps = `${Math.max(1, Math.round(parseInt(r) * multi))}/רגל`;
          else finalReps = `${Math.max(1, Math.round(parseInt(r) * multi))}`;
          
          let wText = "";
          if (e.wFactor) wText = `${Math.round(userWeight * e.wFactor)} ק"ג`;

          return {...e, sets: sets, reps: finalReps, weightText: wText};
        });
      }, [wType, mastered, duration, answers, caliTiersBase, gymTiersBase, unlockedTier]);

      const [exIdx, setExIdx]   = useState(0);
      const [setIdx, setSetIdx] = useState(0);
      
      const [resting, setResting] = useState(false);
      const [timer, setTimer] = useState(0);
      const [done, setDone] = useState(false);

      const ex = plan[exIdx];
      const isTimeBased = ex && ex.reps && ex.reps.includes("שנ'");
      const targetTime = isTimeBased ? parseInt(ex.reps) : 0;
      
      const [exTimerActive, setExTimerActive] = useState(false);
      const [exTimeLeft, setExTimeLeft] = useState(0);

      useEffect(() => {
          if(isTimeBased) setExTimeLeft(targetTime);
          setExTimerActive(false);
      }, [exIdx, setIdx, isTimeBased, targetTime]);

      useEffect(() => {
          if(exTimerActive && exTimeLeft > 0 && !resting) {
              const t = setTimeout(() => setExTimeLeft(l => l - 1), 1000);
              return () => clearTimeout(t);
          }
      }, [exTimerActive, exTimeLeft, resting]);
      
      const restTime = answers.goal && answers.goal.indexOf('ירידה') >= 0 ? 60 : 90;
    
      useEffect(() => {
        if (!resting || timer<=0) { if (resting && timer===0) setResting(false); return; }
        const t = setTimeout(()=>setTimer(s=>s-1), 1000);
        return ()=>clearTimeout(t);
      }, [resting, timer]);
    
      const finishSet = () => {
        const currentEx = plan[exIdx];
        if(!currentEx) return;
        if (setIdx+1 < currentEx.sets) { setSetIdx(s=>s+1); setTimer(restTime); setResting(true); }
        else if (exIdx+1 < plan.length) { setExIdx(i=>i+1); setSetIdx(0); setTimer(restTime); setResting(true); }
        else setDone(true);
      };
    
      if (done) return (
        <div className="min-h-screen bg-black flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
          <div className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 ${th.bgPrimary} rounded-full opacity-10 blur-[100px] pointer-events-none`}/>
          <div className="relative z-10 w-full max-w-sm flex flex-col items-center">
            <div className={`w-28 h-28 mb-8 rounded-3xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-6xl shadow-2xl ${th.shadowPrimary}`}>🏆</div>
            <h2 className="text-5xl font-black text-white mb-2">כל הכבוד!</h2>
            <p className="text-zinc-400 mb-8 text-lg">אימון מותאם אישית הושלם.</p>
            <div className="w-full bg-zinc-900 rounded-3xl p-6 border border-zinc-800 mb-8 space-y-4 shadow-xl">
               <div className="flex justify-between items-center"><span className="text-zinc-400">תרגילים</span><span className="font-black text-white text-xl">{plan.length}</span></div>
               <div className="flex justify-between items-center"><span className="text-zinc-400">סטים</span><span className="font-black text-white text-xl">{plan.reduce((a,b)=>a+(b.sets||3),0)}</span></div>
               <div className="flex justify-between items-center pt-3 border-t border-zinc-800"><span className="text-zinc-400 font-bold">XP נצבר</span><span className={`font-black ${th.textPrimary} text-xl`}>+100 {th.emoji}</span></div>
            </div>
            <button onClick={onFinish} className="w-full bg-white text-black font-black py-5 rounded-2xl text-xl active:scale-95 transition-transform">סיום אימון</button>
          </div>
        </div>
      );
      
      if (resting) return (
        <div className="min-h-screen bg-black flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
          <div className={`absolute inset-0 ${th.bgPrimary10} animate-pulse pointer-events-none`}></div>
          <div className={`text-xs font-bold ${th.textPrimary} uppercase tracking-widest mb-6 ${th.bgPrimary10} px-4 py-2 rounded-full border ${th.borderPrimary30} relative z-10`}>זמן התאוששות - {answers.goal && answers.goal.indexOf('ירידה') >= 0 ? 'חיטוב' : 'מסה'}</div>
          <div className="text-[10rem] font-black text-white leading-none tabular-nums relative z-10 drop-shadow-2xl">{timer}</div>
          <p className="text-zinc-500 font-bold uppercase mt-4 tracking-widest text-sm relative z-10">שניות נותרו לסט הבא</p>
          <div className="mt-16 flex items-center justify-center gap-3 text-zinc-400 bg-zinc-900/80 backdrop-blur-md border border-zinc-800 px-6 py-4 rounded-2xl relative z-10 shadow-xl"><Lock className={`w-5 h-5 ${th.textPrimary}`} /><span className="text-sm font-bold">השריר נבנה עכשיו. לא לדלג.</span></div>
        </div>
      );
    
      return (
        <div className="min-h-screen p-6 flex flex-col justify-between bg-black relative overflow-hidden">
          <div className={`absolute -top-32 -right-32 w-96 h-96 ${th.bgPrimary} rounded-full opacity-10 blur-[120px] pointer-events-none`}/>
          <div className="flex justify-between items-center mb-8 relative z-10"><span className="text-zinc-500 font-bold text-sm uppercase tracking-widest">תרגיל {exIdx+1} / {plan.length}</span><span className={`${th.textPrimary} font-bold text-sm uppercase tracking-widest`}>סט {setIdx+1} / {ex?.sets || 3}</span></div>
          <div className="flex-1 flex flex-col items-center justify-center relative z-10">
            <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 w-full max-w-sm text-center shadow-2xl relative overflow-hidden">
               <div className={`absolute top-0 left-0 w-full h-1 ${th.gradientBg}`}></div>
               {ex?.isMastered && (<div className={`inline-flex items-center gap-1.5 ${th.bgPrimary10} ${th.textPrimary} border ${th.borderPrimary20} px-3 py-1.5 rounded-full text-xs font-bold mb-4`}>{th.emoji} תרגיל מותאם אישית</div>)}
               <h2 className="text-4xl font-black text-white mb-2">{ex?.name}</h2>
               <div className="text-sm text-zinc-400 mb-6">{ex?.target === 'core' ? 'שרירי ליבה' : ex?.target === 'push' ? 'דחיפה' : ex?.target === 'pull' ? 'משיכה' : 'רגליים'}</div>
               
               {isTimeBased ? (
                 <div className="flex flex-col items-center">
                    <div className={`text-8xl font-black tabular-nums leading-none ${exTimerActive && exTimeLeft > 0 ? th.textPrimary : 'text-white'}`}>{exTimeLeft}</div>
                    <div className="text-zinc-500 font-bold uppercase tracking-widest text-sm mt-3 mb-4">שניות</div>
                    {!exTimerActive && exTimeLeft === targetTime && (<button onClick={()=>setExTimerActive(true)} className={`mt-2 w-full ${th.gradientBg} text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-transform`}>הפעל טיימר</button>)}
                 </div>
               ) : (
                 <>
                   <div className={`text-8xl font-black tabular-nums leading-none ${th.textPrimary} drop-shadow-lg`}>{ex?.reps}</div>
                   <div className="text-zinc-500 font-bold uppercase tracking-widest text-sm mt-3 mb-4">חזרות</div>
                 </>
               )}
               {ex?.weightText && (
                 <div className={`text-xl font-black mt-4 p-3 rounded-xl border ${th.borderPrimary30} ${th.bgPrimary10} ${th.textPrimaryLight}`}>
                   משקל מומלץ: {ex.weightText}
                 </div>
               )}
            </div>
          </div>
          
          <div className="relative z-10 mt-6">
            <button onClick={finishSet} disabled={isTimeBased && exTimerActive && exTimeLeft > 0} className={`w-full ${isTimeBased && exTimerActive && exTimeLeft > 0 ? 'bg-zinc-800 text-zinc-500 cursor-not-allowed' : 'bg-white text-black hover:scale-[1.02]'} py-5 rounded-2xl font-black text-xl mb-4 transition-all shadow-xl flex justify-center items-center gap-2`}>
              {isTimeBased && exTimerActive && exTimeLeft > 0 ? 'המתן לסיום הטיימר...' : 'סיימתי את הסט ✓'}
            </button>
            <button onClick={onExit} className="w-full text-zinc-600 font-bold text-sm uppercase tracking-widest hover:text-white transition-colors">יציאה מהאימון</button>
          </div>
        </div>
      );
    }
    
    function SkillTree({ mastered, unlockedTier, toggle, onPassTest, showToast, isHybrid, th, caliTiers, gymTiers, answers, autoMasteredIds }) {
      const [selSkill, setSelSkill] = useState(null);
      const [testModalTier, setTestModalTier] = useState(null);
      const [activeTree, setActiveTree] = useState('cali'); 

      const currentTiersBase = activeTree === 'cali' ? caliTiers : gymTiers;
      const treeTheme = activeTree === 'cali' ? getTheme('קליסטניקס (משקל גוף)') : getTheme('חדר כושר (משקולות)');

      const weight = parseInt(answers.weight) || 70;
      const height = parseInt(answers.height) || 170;
      const bmi = (weight / Math.pow(height/100, 2)).toFixed(1);
      const age = parseInt(answers.age) || 25;
      const needsAdaptation = parseFloat(bmi) > 26 || age > 45;

      const maxLevelInTiers = currentTiersBase.length > 0 ? currentTiersBase[currentTiersBase.length - 1].level : 1;

      // ACTUAL TREE UNLOCK LEVEL FIX (BUG FIX #1)
      const lowestLevelInCurrentTree = currentTiersBase.length > 0 ? currentTiersBase[0].level : 1;
      const actualTreeUnlockLevel = Math.max(unlockedTier, lowestLevelInCurrentTree);

      return (
        <div className="p-6 pt-8 bg-black min-h-screen pb-32">
          <h1 className="text-4xl font-black text-white mb-2">Fitai Tiers</h1>
          
          <div className="bg-zinc-900 rounded-3xl p-5 mb-6 border border-zinc-800 shadow-lg">
             <div className={`text-xs font-bold ${th.textPrimary} uppercase tracking-widest mb-3`}>ניקוי אלגוריתמי פעיל 🧠</div>
             <div className="grid grid-cols-2 gap-4 text-sm text-zinc-300">
                <div>
                   <span className="text-zinc-500 block mb-1">פטור מתרגילי בסיס</span>
                   <span className="font-bold text-white bg-zinc-800 px-2 py-1 rounded">
                      {Math.floor(autoMasteredIds.length / 2)} תרגילים נמחקו
                   </span>
                </div>
                <div>
                   <span className="text-zinc-500 block mb-1">התאמות פיזיות</span>
                   <span className={`font-bold px-2 py-1 rounded ${needsAdaptation ? 'bg-orange-500/20 text-orange-400' : 'bg-green-500/20 text-green-400'}`}>
                      {needsAdaptation ? 'מגן מפרקים' : 'עצימות רגילה'}
                   </span>
                </div>
             </div>
          </div>
          
          {isHybrid && (
            <div className="flex bg-zinc-900 rounded-full p-1 mb-6 border border-zinc-800 shadow-inner">
              <button onClick={() => setActiveTree('cali')} className={`flex-1 py-3 rounded-full font-black text-sm transition-all ${activeTree==='cali'?'bg-orange-500 text-white shadow-lg':'text-zinc-500 hover:text-zinc-300'}`}>קליסטניקס 🔥</button>
              <button onClick={() => setActiveTree('gym')} className={`flex-1 py-3 rounded-full font-black text-sm transition-all ${activeTree==='gym'?'bg-blue-500 text-white shadow-lg':'text-zinc-500 hover:text-zinc-300'}`}>חדר כושר ⚡</button>
            </div>
          )}

          <div className="space-y-8">
            {currentTiersBase.length === 0 ? (
               <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-8 text-center text-zinc-400 shadow-lg">
                  <div className="text-6xl mb-4">👑</div>
                  <h3 className="text-2xl font-black text-white mb-2">אתה פשוט מפלצת</h3>
                  <p>האלגוריתם שלנו בדק את הנתונים שלך והחליט שאתה חזק מדי בשביל הרמות הקיימות במסלול הזה!</p>
               </div>
            ) : currentTiersBase.map((tier) => {
              const isUnlocked = tier.level <= actualTreeUnlockLevel;
              const isCurrentTest = tier.level === actualTreeUnlockLevel && tier.level < maxLevelInTiers;
              
              const masteredInTier = tier.skills.filter(sk => mastered.includes(sk.id)).length;
              const neededForTest = tier.skills.length > 5 ? 5 - masteredInTier : tier.skills.length - masteredInTier;
              const canTakeTest = neededForTest <= 0;
              
              return (
                <div key={tier.level} className={`border rounded-3xl p-5 transition-all ${isUnlocked ? `${treeTheme.borderPrimary30} bg-zinc-900/50` : 'border-zinc-800 bg-zinc-950 opacity-60'}`}>
                  <div className="flex justify-between items-center mb-4 pb-4 border-b border-zinc-800/50">
                    <div className="text-right flex-1">
                      <div className="flex items-center justify-end gap-2 mb-1"><h3 className="text-2xl font-black text-white">{tier.name}</h3>{!isUnlocked && <Lock className="w-5 h-5 text-zinc-500" />}</div>
                      <span className="text-xs text-zinc-500 block">{tier.skills.length} תרגילים מתקדמים שרדו למבחן</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3 mb-5 direction-rtl">
                    {tier.skills.map(sk => {
                      const mast = mastered.includes(sk.id);
                      return (
                        <button key={sk.id} 
                          onClick={() => {
                            if (!isUnlocked) { showToast('🔒 הטיר הזה עדיין נעול!'); return; }
                            setSelSkill({ ...sk, theme: treeTheme });
                          }}
                          className={`aspect-square rounded-2xl flex flex-col items-center justify-center p-2 text-center border-2 transition-all
                            ${mast ? `${treeTheme.bgPrimary} ${treeTheme.borderPrimary} text-white shadow-lg ${treeTheme.shadowPrimary}` : 
                              isUnlocked ? `bg-zinc-800 border-zinc-700 text-zinc-300 hover:${treeTheme.borderPrimary50}` : 
                              'bg-zinc-900 border-zinc-800 text-zinc-600'}
                          `}>
                          <span className="text-xs font-bold leading-tight">{sk.name}</span>
                          {mast && <span className="mt-1 text-xs">✓</span>}
                        </button>
                      )
                    })}
                  </div>

                  {isCurrentTest && (
                     <div className="mt-2">
                       {canTakeTest ? (
                         <button onClick={() => setTestModalTier({...tier, theme: treeTheme})}
                           className={`w-full ${treeTheme.gradientBg} text-white font-black py-3 rounded-xl shadow-lg active:scale-95 transition-transform flex justify-center items-center gap-2`}>
                           <span>{treeTheme.emoji} פתוח: לחץ כאן למעבר שלב</span>
                         </button>
                       ) : (
                         <div className="w-full bg-zinc-800/50 border border-zinc-700/50 text-zinc-500 font-bold py-3 rounded-xl text-center text-sm flex flex-col gap-1 items-center justify-center">
                           <span>🔒 מבחן מעבר נעול</span>
                           <span className="text-xs font-normal">סמן עוד {neededForTest} תרגילים כדי לגשת.</span>
                         </div>
                       )}
                     </div>
                  )}
                  {tier.level < actualTreeUnlockLevel && (<div className="w-full bg-zinc-800 text-green-400 font-bold py-2 rounded-xl text-center text-sm">✓ מבחן הטיר הושלם</div>)}
                  {tier.level === maxLevelInTiers && (<div className="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-white font-black py-2 rounded-xl text-center text-sm shadow-lg">👑 מאסטר עליון - הגעת לסוף העץ!</div>)}
                </div>
              );
            })}
          </div>

          {selSkill && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={()=>setSelSkill(null)}>
              <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 max-w-md w-full shadow-2xl overflow-y-auto max-h-[90vh]" onClick={e=>e.stopPropagation()}>
                <div className="flex justify-between items-start mb-4">
                  <button onClick={()=>setSelSkill(null)} className="text-zinc-500 hover:text-white text-xl">✕</button>
                  <div className="text-right"><div className={`text-xs ${selSkill.theme.textPrimary} font-bold uppercase mb-1`}>מידע טכני מפורט</div><h3 className="text-2xl font-black text-white">{selSkill.name}</h3></div>
                </div>
                <MuscleMan target={selSkill.target} th={selSkill.theme} />
                <div className="bg-black rounded-xl p-5 border border-zinc-800 mb-6 text-right"><p className="text-sm text-zinc-300 leading-relaxed whitespace-pre-wrap">{selSkill.desc}</p></div>
                <button onClick={()=>{
                     toggle(selSkill.id); setSelSkill(null);
                }} className={`w-full font-black py-4 rounded-2xl transition-all shadow-xl active:scale-95 ${mastered.includes(selSkill.id) ? 'bg-zinc-800 text-white hover:bg-zinc-700' : `${selSkill.theme.bgPrimary} text-white`}`}>
                  {mastered.includes(selSkill.id) ? 'הסר מאימונים עתידיים' : '✓ סמנתי (יכנס לאימון הבא)'}
                </button>
              </div>
            </div>
          )}

          {testModalTier && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4" onClick={()=>setTestModalTier(null)}>
               <div className={`bg-zinc-900 border-2 ${testModalTier.theme.borderPrimary50} rounded-3xl p-7 max-w-md w-full text-right`} onClick={e=>e.stopPropagation()}>
                  <div className="text-center mb-6"><div className="text-6xl mb-4">⚠️</div><h2 className="text-3xl font-black text-white">מבחן מעבר טיר</h2><p className="text-zinc-400 text-sm mt-2">כדי לפתוח את הרמה הבאה, עליך להשלים את האתגר הבא ברצף או באימון אחד:</p></div>
                  <div className="bg-black rounded-2xl p-5 border border-zinc-800 mb-8"><p className={`${testModalTier.theme.textPrimary} font-bold text-lg text-center`}>{testModalTier.testDesc}</p></div>
                  <button onClick={() => { onPassTest(testModalTier.level); setTestModalTier(null); }} className={`w-full ${testModalTier.theme.gradientBg} text-white font-black py-4 rounded-2xl text-lg mb-3 shadow-lg ${testModalTier.theme.shadowPrimary40} active:scale-95 transition-all`}>השלמתי את המבחן בהצלחה!</button>
                  <button onClick={()=>setTestModalTier(null)} className="w-full text-zinc-500 font-bold py-3 hover:text-white transition-colors">עדיין לא מוכן</button>
               </div>
            </div>
          )}
        </div>
      );
    }

    function NutritionView({ answers, onMealTrack, lastMealTrack, th }) {
      const [mood, setMood] = useState('training');
      const [refresh, setRefresh] = useState(0);
      const [expandedRecipe, setExpandedRecipe] = useState(null);
      
      const tdee = useMemo(()=>calcTDEE(answers.weight,answers.height,answers.age,answers.gender,answers.goal),[answers]);
      
      const algSet = new Set((answers.allergies||[]).map(a=>ALLERGY_MAP[a]).filter(Boolean));
      const noAlg = !(answers.allergies||[]).length || (answers.allergies||[]).indexOf('ללא')>=0;
      const dislikesArr = (answers.dislikes || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      
      // BUG FIX #4: SAFE NUTRITION FILTER
      const getMeal = (t) => {
        let opts = (getDynamicMeals(tdee, mood)[t] || []).filter(m => noAlg || !(m.tags||[]).some(x=>algSet.has(x)));
        if (dislikesArr.length > 0 && opts.length > 0) {
          const tempOpts = opts.filter(m => {
            const ingsStr = typeof m.ings === 'function' ? m.ings(tdee).toLowerCase() : "";
            const nameLower = m.name.toLowerCase();
            return !dislikesArr.some(d => ingsStr.includes(d) || nameLower.includes(d));
          });
          if (tempOpts.length > 0) opts = tempOpts;
        }
        
        if (!opts || opts.length === 0) return {name:'אין ארוחה מתאימה', ings:()=>'נסה לשחרר מגבלות או אלרגיות בשאלון.', multi:0, recipe:''};
        const offset = t === 'morning' ? 0 : t === 'lunch' ? 1 : 2;
        return opts[(refresh + offset) % opts.length] || {name:'אין ארוחה מתאימה', ings:()=>'נסה לשנות את ההגדרות בשאלון.', multi:0, recipe:''};
      };

      const age = answers.age || 25;
      const isUnderage = age < 16;
      const todayStr = new Date().toDateString();
      const alreadyTrackedToday = lastMealTrack === todayStr;

      return (
        <div className="p-6 pt-8 pb-32">
          <div className="flex justify-between items-center mb-6">
            <h1 className="text-4xl font-black text-white">תזונה חכמה</h1>
            <div className="text-left">
              <span className={`block text-xs ${th.textPrimary} font-bold uppercase tracking-widest`}>צריכה יומית</span>
              <span className="text-xl font-black text-white">{tdee} <span className="text-sm font-normal text-zinc-400">קק"ל</span></span>
            </div>
          </div>
          
          <button onClick={onMealTrack} disabled={alreadyTrackedToday} className={`w-full py-4 rounded-2xl font-black text-lg mb-6 shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2 ${alreadyTrackedToday ? 'bg-zinc-800 text-green-400 border border-green-500/30' : `${th.bgPrimary} text-white`}`}>
             {alreadyTrackedToday ? '✓ סומן להיום - יפה מאוד!' : '🍽️ לחץ כאן אם אכלת לפי התפריט היום'}
          </button>
          
          {isUnderage && (
            <div className={`${th.bgPrimary10} border ${th.borderPrimary30} rounded-xl p-4 mb-6`}>
              <div className={`${th.textPrimary} font-bold text-sm mb-1`}>⚠️ שים לב:</div>
              <div className="text-zinc-300 text-xs leading-relaxed">מכיוון שאתה בן {age}, הגוף שלך עדיין בשלבי גדילה. מנוע Fitai חוסם גרעון קלורי קיצוני ומכוון לבנייה.</div>
            </div>
          )}

          <div className="flex gap-3 mb-6 overflow-x-auto pb-1">
            {[['training',`${th.emoji} מתאמן`,`${th.bgPrimary600}`],['rest','🧘 מנוחה','bg-green-700'],['sick','🤒 חולה','bg-zinc-700']].map(([k,lb,cl])=>(
              <button key={k} onClick={()=>setMood(k)} className={`px-5 py-2.5 rounded-full whitespace-nowrap font-bold text-sm transition-all ${mood===k?`${cl} text-white scale-105 shadow-lg`:'bg-zinc-900 text-zinc-400 hover:bg-zinc-800'}`}>{lb}</button>
            ))}
          </div>
          
          <button onClick={()=>setRefresh(r=>r+1)} className={`w-full bg-zinc-900 border border-zinc-700 p-4 rounded-2xl mb-6 font-black ${th.textPrimary} active:scale-95 transition-transform flex justify-center items-center gap-3`}>🔄 ערבב תפריט אישי</button>
          
          {['morning','lunch','evening'].map(t => {
            const meal = getMeal(t);
            const lb = t==='morning' ? 'ארוחת בוקר' : t==='lunch' ? 'ארוחת צהריים' : 'ארוחת ערב';
            const kcal = Math.round(tdee * (meal.multi || 0));
            const ingredientsText = typeof meal.ings === 'function' ? meal.ings(tdee) : meal.ings;
            
            return (
              <div key={t} className="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 mb-5 relative overflow-hidden">
                <div className={`absolute top-0 right-0 w-1.5 h-full ${th.gradientBg}`}/>
                <div className="flex justify-between items-start mb-2">
                   <div className="text-xs font-black text-zinc-500 uppercase tracking-widest">{lb}</div>
                   <div className="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-400 font-bold">~{kcal} קק״ל</div>
                </div>
                <h3 className="text-2xl font-black text-white mb-4">{meal.name}</h3>
                
                <div className="bg-black/50 p-4 rounded-xl border border-zinc-800 text-sm text-zinc-300 mb-3">
                  <div className="leading-relaxed">{ingredientsText}</div>
                </div>

                {meal.recipe && (
                  <button onClick={() => setExpandedRecipe(expandedRecipe === meal.name ? null : meal.name)} className={`w-full text-center text-xs font-bold ${th.textPrimary} hover:text-white transition-colors`}>
                    {expandedRecipe === meal.name ? 'הסתר מתכון' : '📖 הצג מתכון מלא'}
                  </button>
                )}

                {expandedRecipe === meal.name && meal.recipe && (
                  <div className="mt-3 p-4 bg-zinc-950 rounded-xl border border-zinc-800 text-xs text-zinc-400 whitespace-pre-wrap text-right leading-relaxed">
                    {meal.recipe}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }
    
    function NotificationsView({ answers, notifEnabled, onToggle, onToggleAll, onTest, th }) {
      const isWorkoutToday = answers.days && answers.days.indexOf(DAYS_HE[new Date().getDay()])>=0;
      const goal = answers.goal && answers.goal.indexOf('ירידה')>=0 ? 'חיטוב' : 'מסה';
      const name = answers.name || 'Lupu';
      const allOn = NOTIF_SLOTS.every(s => notifEnabled[s.id] !== false);
    
      return (
        <div className="p-6 pt-8 pb-32">
          <h1 className="text-4xl font-black text-white mb-1">התראות דחיפה</h1>
          <p className="text-zinc-400 text-sm mb-5">תזכורות נשלחות כהתראות דחיפה לדפדפן גם כשהאפליקציה פתוחה ברקע.</p>
    
          <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-5 flex justify-between items-center">
            <button onClick={onToggleAll} className={`w-12 h-6 rounded-full relative transition-all duration-300 ${allOn?th.bgPrimary:'bg-zinc-700'}`}>
              <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all duration-300 ${allOn?'right-0.5':'left-0.5'}`}/>
            </button>
            <div className="text-right">
              <div className="font-black text-white text-sm">הפעל / כבה הכל</div>
              <div className="text-xs text-zinc-500">{NOTIF_SLOTS.filter(s=>notifEnabled[s.id]!==false).length} מתוך {NOTIF_SLOTS.length} פעילות</div>
            </div>
          </div>
    
          <div className="space-y-3">
            {NOTIF_SLOTS.map(slot => {
              const isOn = notifEnabled[slot.id] !== false;
              const body = slot.bodyFn(isWorkoutToday, goal, name);
              return (
                <div key={slot.id} className={`bg-zinc-900 rounded-2xl border transition-all ${isOn?'border-zinc-700':'border-zinc-900'}`}>
                  <div className="flex items-center gap-3 p-4">
                    <div className={`w-11 h-11 rounded-full flex items-center justify-center text-xl flex-shrink-0 transition-all ${isOn?`${th.gradientBg} shadow-lg ${th.shadowPrimary30}`:'bg-zinc-800'}`}>{slot.icon}</div>
                    <div className="flex-1 min-w-0 text-right">
                      <div className="flex justify-between items-center mb-0.5">
                        <span className={`text-xs font-bold tabular-nums ${isOn?th.textPrimary:'text-zinc-600'}`}>{String(slot.hour).padStart(2,'0')}:{String(slot.min).padStart(2,'0')}</span>
                        <span className="font-bold text-white text-sm">{slot.title}</span>
                      </div>
                      <p className="text-xs text-zinc-500 leading-snug truncate">{body}</p>
                    </div>
                    <button onClick={()=>onToggle(slot.id, !isOn)} className={`w-11 h-6 rounded-full relative transition-all duration-300 flex-shrink-0 ${isOn?th.bgPrimary:'bg-zinc-700'}`}>
                      <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all duration-300 ${isOn?'right-0.5':'left-0.5'}`}/>
                    </button>
                  </div>
                  {isOn && (
                    <div className="px-4 pb-3"><button onClick={()=>onTest(slot)} className="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold py-2 rounded-xl transition-colors active:scale-95">📬 שלח התראת ניסיון כעת</button></div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
